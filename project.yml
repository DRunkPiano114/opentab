name: OpenTab
options:
  bundleIdPrefix: com.paulwu
  deploymentTarget: { macOS: "26.0" }
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: "arm64"
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: NO
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

packages:
  OpenTabKit:
    path: Packages/OpenTabKit

targets:
  OpenTab:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: OpenTabKit
        product: OpenTabCore
      - package: OpenTabKit
        product: OpenTabAX
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: OpenTab
        CFBundleDisplayName: OpenTab
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Copyright © 2026 Lingwei Wu. All rights reserved."
        NSAppleEventsUsageDescription: "OpenTab sends Apple Events to other applications to enumerate their windows and tabs and bring the one you pick to the front."
        NSAccessibilityUsageDescription: "OpenTab uses the Accessibility API to list open windows and switch between them."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: Support/OpenTab.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.cs.allow-dyld-environment-variables: false
        com.apple.security.get-task-allow: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulwu.opentab
        PRODUCT_NAME: OpenTab
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/OpenTab.entitlements
        CODE_SIGN_STYLE: Manual
        # Fixed in the project, not on the make command line: every build path
        # (xcodebuild, Xcode GUI, xcodebuild test) must produce the same
        # designated requirement, or the Accessibility grant silently dies.
        CODE_SIGN_IDENTITY: "OpenTab Dev Signing"
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  OpenTabAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/OpenTabAppTests]
    dependencies:
      - target: OpenTab
      # link: false — the static products are already inside the host app and
      # BUNDLE_LOADER resolves their symbols; linking them twice fails the build.
      - package: OpenTabKit
        product: OpenTabCore
        link: false
      - package: OpenTabKit
        product: OpenTabAX
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paulwu.opentab.apptests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenTab.app/Contents/MacOS/OpenTab"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "OpenTab Dev Signing"
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        DEVELOPMENT_TEAM: ""

schemes:
  OpenTab:
    build:
      targets: { OpenTab: all, OpenTabAppTests: [test] }
    test:
      config: Debug
      targets: [OpenTabAppTests]
    run:
      config: Debug
    archive:
      config: Release
