name: OpenTab
options:
  bundleIdPrefix: im.opentab
  deploymentTarget: { macOS: "26.0" }
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: "arm64"
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    # The git tag is the only source of a real version. Release builds pass
    # MARKETING_VERSION and CURRENT_PROJECT_VERSION on the xcodebuild command
    # line (see Scripts/release.sh); local builds keep these placeholders.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0"
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

packages:
  OpenTabKit:
    path: Packages/OpenTabKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  OpenTab:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: OpenTabKit
        product: OpenTabCore
      - package: OpenTabKit
        product: OpenTabAX
      - package: OpenTabKit
        product: OpenTabWS
      - package: OpenTabKit
        product: OpenTabScript
      - package: Sparkle
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: $(OPENTAB_BUNDLE_NAME)
        CFBundleDisplayName: $(OPENTAB_BUNDLE_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "Copyright © 2026 Lingwei Wu"
        NSAppleEventsUsageDescription: "OpenTab sends Apple Events to other applications to enumerate their windows and tabs and bring the one you pick to the front."
        NSAccessibilityUsageDescription: "OpenTab uses the Accessibility API to list open windows and switch between them."
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        SUFeedURL: $(OPENTAB_FEED_URL)
        SUPublicEDKey: $(OPENTAB_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
    # Debug entitlements, generated into Support/OpenTab.entitlements.
    # get-task-allow and disable-library-validation exist for the app-hosted
    # test bundles: they are signed with the same team-less self-signed
    # certificate as the host app, and library validation would refuse to load
    # them. Release builds must not carry either (notarization rejects
    # get-task-allow), so they switch to the hand-written
    # Support/OpenTab-Release.entitlements below.
    entitlements:
      path: Support/OpenTab.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.cs.allow-dyld-environment-variables: false
        com.apple.security.get-task-allow: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.opentab.app
        PRODUCT_NAME: OpenTab
        # The name shown in the Accessibility list and Spotlight. PRODUCT_NAME
        # stays OpenTab in every configuration: the executable name is what
        # TEST_HOST keys on.
        OPENTAB_BUNDLE_NAME: OpenTab
        # Empty in Debug: with no feed the app never constructs the
        # updater, so the development copy cannot replace itself with
        # the release build. Release sets the URL below.
        OPENTAB_FEED_URL: ""
        # Sparkle's EdDSA public key, base64, the same in every
        # configuration. Empty until the key exists; the app treats an
        # empty key like an empty feed and starts no updater.
        OPENTAB_SPARKLE_PUBLIC_KEY: jKM6wAMes4FHKOgWkD0oC0jPE0vdXvA+Nbn6RjMl4rA=
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/OpenTab.entitlements
        CODE_SIGN_STYLE: Manual
        # Fixed in the project, not on the make command line: every build path
        # (xcodebuild, Xcode GUI, xcodebuild test) must produce the same
        # designated requirement, or the Accessibility grant silently dies.
        CODE_SIGN_IDENTITY: "OpenTab Dev Signing"
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Debug builds are a separate app to the system: their own TCC rows,
        # UserDefaults domain, log subsystem and cache directory, so a
        # development copy in ~/Applications and the installed release can
        # hold grants and run at the same time. The signing identity is the
        # same, so the designated requirement only changes its identifier.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: im.opentab.app.dev
          OPENTAB_BUNDLE_NAME: OpenTab Dev
        # Distributed builds: Developer ID, secure timestamp, hardened runtime
        # with library validation on. The resulting designated requirement is
        # anchored to the team id, so it stays stable across certificate
        # renewals and the installed copy keeps its Accessibility grant.
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: 5RV9PT7PK4
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          OPENTAB_FEED_URL: https://github.com/DRunkPiano114/opentab/releases/latest/download/appcast.xml
          # The plain `xcodebuild build` action injects get-task-allow into
          # every configuration (only `archive` leaves it out), and
          # notarization rejects it.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          # XcodeGen writes the generated entitlements path into every
          # configuration after applying these settings, so a plain
          # CODE_SIGN_ENTITLEMENTS here would be overwritten; the conditional
          # form survives and wins for Release.
          "CODE_SIGN_ENTITLEMENTS[config=Release]": Support/OpenTab-Release.entitlements
    postBuildScripts:
      # A plain `xcodebuild build` re-signs Sparkle.framework on copy and
      # nothing inside it: Autoupdate, Updater.app and the XPC services keep
      # their ad-hoc signatures, which notarization rejects. The helpers are
      # signed one by one, framework last because its seal covers them, with
      # the identity and flags of the configuration being built, never
      # deep-signed. The XPC services exist for sandboxed hosts only.
      - name: Re-sign Sparkle helpers
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          FW="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/Sparkle.framework"
          [[ -d "$FW" ]] || { echo "error: Sparkle.framework missing at $FW" >&2; exit 1; }
          rm -rf "$FW/Versions/B/XPCServices"
          for item in "$FW/Versions/B/Autoupdate" "$FW/Versions/B/Updater.app" "$FW/Versions/B"; do
            codesign -f -s "$EXPANDED_CODE_SIGN_IDENTITY" -o runtime $OTHER_CODE_SIGN_FLAGS "$item"
          done

  OpenTabAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/OpenTabAppTests]
    dependencies:
      - target: OpenTab
      # link: false — the static products are already inside the host app and
      # BUNDLE_LOADER resolves their symbols; linking them twice fails the build.
      - package: OpenTabKit
        product: OpenTabCore
        link: false
      - package: OpenTabKit
        product: OpenTabAX
        link: false
      - package: OpenTabKit
        product: OpenTabWS
        link: false
      - package: OpenTabKit
        product: OpenTabScript
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.opentab.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenTab.app/Contents/MacOS/OpenTab"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "OpenTab Dev Signing"
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        DEVELOPMENT_TEAM: ""

  # Tests for windows on other Spaces that need the real app bundle:
  # cross-process remote token scans, CGS Space queries and the Cmd+Tab
  # takeover all run under the host app's Accessibility grant.
  OpenTabWSAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/OpenTabWSAppTests]
    dependencies:
      - target: OpenTab
      - package: OpenTabKit
        product: OpenTabCore
        link: false
      - package: OpenTabKit
        product: OpenTabAX
        link: false
      - package: OpenTabKit
        product: OpenTabWS
        link: false
      - package: OpenTabKit
        product: OpenTabScript
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: im.opentab.app.tests.ws
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/OpenTab.app/Contents/MacOS/OpenTab"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "OpenTab Dev Signing"
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        DEVELOPMENT_TEAM: ""

schemes:
  OpenTab:
    build:
      targets: { OpenTab: all, OpenTabAppTests: [test], OpenTabWSAppTests: [test] }
    test:
      config: Debug
      targets: [OpenTabAppTests, OpenTabWSAppTests]
    run:
      config: Debug
    archive:
      config: Release
