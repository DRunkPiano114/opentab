name: Release

on:
  push:
    tags: ["v*"]

# Two triggers for the same tag would sign and notarize in parallel and then
# collide in `gh release create`. Queueing them is not a fix for a duplicate
# release, but it stops the two runs from racing each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    # Build, then notarization: Apple's queue is usually minutes but has no
    # upper bound, and release.sh waits for the verdict.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the gh CLI talks to GitHub, and it reads GH_TOKEN; keep the
          # write-scoped token out of .git/config.
          persist-credentials: false
          # release.sh derives CFBundleVersion from `git rev-list --count
          # HEAD`. The default shallow clone has one commit, which would make
          # every release report build 1 and break the monotonic ordering
          # macOS uses to tell two installed copies apart.
          fetch-depth: 0
      # Three gates run before the certificate is imported: the changelog has
      # to carry a section for this tag (it becomes the release body), the tag
      # has to be on main, and the unit tests have to pass. A tag that fails
      # any of them stops here, before anything is signed or published.
      - name: Extract release notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          Scripts/release-notes.sh "$VERSION" > release-notes.md \
            || { echo "::error::CHANGELOG.md has no non-empty section for $VERSION — write the release notes before tagging."; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cat release-notes.md
      # actions/checkout only fetches the ref that triggered the run, so
      # origin/main has to be fetched explicitly. The anonymous fetch works
      # because the repository is public; a private one would need a token.
      - name: Refuse tags outside main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$(git rev-parse 'HEAD^{commit}')" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME is not on main — releases are cut from main only."
            exit 1
          fi
      # Plain swift test: no generated project and no keychain, so it runs
      # before either exists.
      - name: Unit tests
        run: make test
      # OpenTab.xcodeproj is generated from project.yml rather than committed,
      # so xcodegen decides what gets signed. It is downloaded, verified and
      # run here, before the certificate and the notarization key exist on
      # this runner; nothing after this step needs the tool. GITHUB_PATH only
      # reaches later steps, so the bin directory goes into this step's PATH.
      # Sparkle's generate_appcast runs later, next to the EdDSA key, so its
      # download is verified here too: the binary that runs is one whose hash
      # was checked before any secret existed. The assignment is its own line
      # so a failed download stops the step here; inside `echo "X=$(...)"`
      # the exit status would be echo's.
      - name: Generate the Xcode project
        run: |
          BIN="$(Scripts/install-xcodegen.sh "$RUNNER_TEMP")"
          PATH="$BIN:$PATH" make project
          SPARKLE_BIN="$(Scripts/install-sparkle-tools.sh "$RUNNER_TEMP")"
          echo "SPARKLE_BIN=$SPARKLE_BIN" >> "$GITHUB_ENV"
      # xcodebuild resolves the "Developer ID Application" identity through
      # the keychain search list, so the certificate has to sit in a
      # search-listed keychain before the build runs.
      # set-key-partition-list pre-authorizes codesign for the imported key —
      # without it the non-interactive runner blocks on a keychain prompt.
      # `list-keychains -s` replaces the whole search list, so login is
      # re-listed alongside the build keychain.
      - name: Import the Developer ID certificate into a build keychain
        env:
          APPLE_DEVID_P12: ${{ secrets.APPLE_DEVID_P12 }}
          APPLE_DEVID_P12_PASSWORD: ${{ secrets.APPLE_DEVID_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          printf '%s' "$APPLE_DEVID_P12" | base64 -d > "$RUNNER_TEMP/devid.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/devid.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DEVID_P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S 'apple-tool:,apple:,codesign:' \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/devid.p12"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q "1 valid" \
            || { echo "::error::Developer ID identity not valid in build keychain"; exit 1; }
      # notarytool wants the App Store Connect key as a file. Only the path
      # crosses into GITHUB_ENV; the key id and issuer id are handed to the
      # build step directly so no secret value is ever stored there.
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY_PATH="$RUNNER_TEMP/asc-key.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      # Builds with MARKETING_VERSION set to the tag, signs, notarizes,
      # staples and writes dist/OpenTab-$VERSION.zip plus its checksum. Every
      # signature and Gatekeeper check lives in the script, so a bad build
      # fails before anything is published.
      - name: Build, sign, notarize and package
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: Scripts/release.sh all
      # The EdDSA key reaches generate_appcast on stdin and is never written
      # to disk. After package, so the archive that is signed is the stapled
      # one; before publish, so the appcast is uploaded with the zip it
      # describes.
      - name: Generate the appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: Scripts/release.sh appcast
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/OpenTab-*.zip dist/*.sha256 dist/appcast.xml \
            --title "OpenTab $VERSION" \
            --notes-file release-notes.md
      # The runner is ephemeral, so this bounds the exposure of the signing
      # material to the steps that need it rather than to the rest of the job.
      # KEYCHAIN_PATH never left the step that created it, so the path is
      # spelled out again here. Every command is guarded: a job that died
      # before the keychain existed must not turn red here and hide the real
      # failure.
      - name: Remove the build keychain and the App Store Connect key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc-key.p8" "$RUNNER_TEMP/devid.p12"
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
